components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT obtido via POST /auth/login. O endpoint de login em si deve
        sobrescrever este requisito com "security: []" na definição de users.yaml.
