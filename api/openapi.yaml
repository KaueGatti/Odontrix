openapi: 3.0.3

info:
  title: MINI-WORLD API
  version: 1.0.0
  description: >
    API do template de sistema para clínicas odontológicas.
    Convenções adotadas:
      - Resposta envelopada: { data, meta }
      - Paginação offset-based: ?page=&limit=
      - Filtros estruturados: ?filter[campo]=valor (style: deepObject)
      - Ações não-CRUD como sub-recursos: POST /appointments/{id}/confirm
      - Erros no padrão RFC 7807 (application/problem+json)
      - Extensão x-required-roles em cada operação, espelhando a matriz de permissões
      - Tabelas de apoio seguem soft-delete (PATCH active:false) — exceto Attachment
        (único recurso com DELETE físico) e o próprio Audit Log (somente leitura)

servers:
  - url: https://api.miniworld.com/v1

security:
  - bearerAuth: []

tags:
  - name: Appointments
    description: Ciclo de vida completo da consulta odontológica
  - name: Appointment Types
    description: Tipos de consulta (tabela de apoio)
  - name: Cancellation Reasons
    description: Motivos de cancelamento (tabela de apoio)
  - name: Patients
    description: Cadastro de pacientes
  - name: Anamnesis
    description: Histórico de anamnese do paciente (evolutivo)
  - name: Attachments
    description: Radiografias e fotos vinculadas ao paciente ou a uma consulta
  - name: Responsibles
    description: Responsável financeiro/legal (obrigatório para pacientes menores de idade)
  - name: Referral Sources
    description: Origem do paciente (tabela de apoio)
  - name: Attachment Types
    description: Tipos de anexo (tabela de apoio)
  - name: Dentists
    description: Cadastro de dentistas
  - name: Dentist Work Schedule
    description: Horário padrão semanal do dentista (versionado)
  - name: Dentist Schedule Exceptions
    description: Substituições pontuais do horário padrão para uma data específica
  - name: Dentist Unavailabilities
    description: Períodos de indisponibilidade (férias, licença etc.)
  - name: Dentist Specialties
    description: Associação entre dentista e especialidades
  - name: Specialties
    description: Especialidades odontológicas (tabela de apoio)
  - name: Dental Plans
    description: Planos odontológicos
  - name: Quotes
    description: Orçamentos de tratamento
  - name: Quote Procedures
    description: Procedimentos incluídos em um orçamento
  - name: Procedures
    description: Catálogo de procedimentos odontológicos e seus preços
  - name: Billing
    description: Cobranças geradas (vinculadas ou não a uma consulta)
  - name: Installments
    description: Parcelas de uma cobrança
  - name: Payments
    description: Pagamentos recebidos ou realizados pela clínica
  - name: Payment Methods
    description: Formas de pagamento aceitas (tabela de apoio)
  - name: Cost Centers
    description: Centros de custo para classificação de gastos
  - name: Boletos
    description: Emissão e acompanhamento de boletos bancários
  - name: Users
    description: Contas de usuário e controle de acesso
  - name: Auth
    description: Autenticação e sessão
  - name: Receptionists
    description: Cadastro de recepcionistas
  - name: Clinic
    description: Dados cadastrais da clínica (recurso singleton)
  - name: Clinic Bank Accounts
    description: Contas bancárias usadas na emissão de boletos
  - name: Clinic Settings
    description: Parâmetros administrativos da clínica (juros, multa, lembretes, sessão)
  - name: Audit Log
    description: Registro somente leitura de toda criação, edição e inativação no sistema

